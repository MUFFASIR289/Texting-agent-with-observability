[project]
name = "texting-agent"
version = "0.1.0"
description = "AI churn prevention and customer retention agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
texting-agent = "texting_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texting_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
